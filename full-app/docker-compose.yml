version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: e-clean-postgres
    environment:
      POSTGRES_USER: eclean_user
      POSTGRES_PASSWORD: eclean_password
      POSTGRES_DB: eclean
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclean_user -d eclean"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: e-clean-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: